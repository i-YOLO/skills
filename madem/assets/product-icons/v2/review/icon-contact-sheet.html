<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 960px; min-height: 1680px; background: #10151d; color: #f7f9fc; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
body { padding: 32px; }
h1 { margin: 0 0 8px; font-size: 28px; }
p { margin: 0 0 24px; color: #aeb8c7; }
.grid { display: grid; grid-template-columns: 210px repeat(3, 218px); gap: 12px; align-items: stretch; }
.head { height: 40px; display: grid; place-items: center; color: #c9d2df; font-weight: 700; }
.name { height: 132px; border: 1px solid #273444; border-radius: 14px; padding: 24px 18px; display: flex; flex-direction: column; justify-content: center; gap: 8px; background: #121a24; }
.name strong { font-size: 19px; }
.name code { color: #39e58c; font-size: 14px; }
.cell { height: 132px; border-radius: 14px; border: 1px solid #344155; display: grid; place-items: center; overflow: hidden; }
.cell img { display: block; width: 88px; height: 88px; object-fit: contain; }
.transparent { background-color: #dfe4ea; background-image: linear-gradient(45deg, #b8c0ca 25%, transparent 25%), linear-gradient(-45deg, #b8c0ca 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #b8c0ca 75%), linear-gradient(-45deg, transparent 75%, #b8c0ca 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
.black { background: #000; }
.white { background: #fff; }
</style>
</head>
<body>
<h1>MADEM Product Icons v2</h1>
<p>project-proven · transparent / black / white review</p>
<div class="grid">
  <div></div><div class="head">透明检查</div><div class="head">黑底</div><div class="head">白底</div>
  <div class="name"><strong>ChatGPT</strong><code>chatgpt</code></div><div class="cell transparent"><img src="../png/chatgpt.png" alt="ChatGPT on transparent"></div><div class="cell black"><img src="../png/chatgpt.png" alt="ChatGPT on black"></div><div class="cell white"><img src="../png/chatgpt.png" alt="ChatGPT on white"></div><div class="name"><strong>Claude</strong><code>claude</code></div><div class="cell transparent"><img src="../source/claude.svg" alt="Claude on transparent"></div><div class="cell black"><img src="../source/claude.svg" alt="Claude on black"></div><div class="cell white"><img src="../source/claude.svg" alt="Claude on white"></div><div class="name"><strong>Gemini</strong><code>gemini</code></div><div class="cell transparent"><img src="../png/gemini.png" alt="Gemini on transparent"></div><div class="cell black"><img src="../png/gemini.png" alt="Gemini on black"></div><div class="cell white"><img src="../png/gemini.png" alt="Gemini on white"></div><div class="name"><strong>Manus</strong><code>manus</code></div><div class="cell transparent"><img src="../png/manus.png" alt="Manus on transparent"></div><div class="cell black"><img src="../png/manus.png" alt="Manus on black"></div><div class="cell white"><img src="../png/manus.png" alt="Manus on white"></div><div class="name"><strong>Perplexity</strong><code>perplexity</code></div><div class="cell transparent"><img src="../source/perplexity.svg" alt="Perplexity on transparent"></div><div class="cell black"><img src="../source/perplexity.svg" alt="Perplexity on black"></div><div class="cell white"><img src="../source/perplexity.svg" alt="Perplexity on white"></div><div class="name"><strong>Coze</strong><code>coze</code></div><div class="cell transparent"><img src="../png/coze.png" alt="Coze on transparent"></div><div class="cell black"><img src="../png/coze.png" alt="Coze on black"></div><div class="cell white"><img src="../png/coze.png" alt="Coze on white"></div><div class="name"><strong>Grok</strong><code>grok</code></div><div class="cell transparent"><img src="../png/grok.png" alt="Grok on transparent"></div><div class="cell black"><img src="../png/grok.png" alt="Grok on black"></div><div class="cell white"><img src="../png/grok.png" alt="Grok on white"></div><div class="name"><strong>DeepSeek</strong><code>deepseek</code></div><div class="cell transparent"><img src="../source/deepseek.svg" alt="DeepSeek on transparent"></div><div class="cell black"><img src="../source/deepseek.svg" alt="DeepSeek on black"></div><div class="cell white"><img src="../source/deepseek.svg" alt="DeepSeek on white"></div><div class="name"><strong>元宝</strong><code>yuanbao</code></div><div class="cell transparent"><img src="../png/yuanbao.png" alt="元宝 on transparent"></div><div class="cell black"><img src="../png/yuanbao.png" alt="元宝 on black"></div><div class="cell white"><img src="../png/yuanbao.png" alt="元宝 on white"></div><div class="name"><strong>Kimi</strong><code>kimi</code></div><div class="cell transparent"><img src="../png/kimi.png" alt="Kimi on transparent"></div><div class="cell black"><img src="../png/kimi.png" alt="Kimi on black"></div><div class="cell white"><img src="../png/kimi.png" alt="Kimi on white"></div>
</div>
</body>
</html>
